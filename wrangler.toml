name = "av-flow-crm"
main = "worker/index.ts"
compatibility_date = "2025-03-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "av-flow-crm-db"
database_id = "450c80b0-b805-4867-bcc2-8e0191c6047b"
migrations_dir = "migrations"

[vars]
APP_ORIGIN = "http://localhost:5173"

# Segredos devem ser configurados com `wrangler secret put`:
# SESSION_SECRET, META_APP_SECRET, META_VERIFY_TOKEN, META_ACCESS_TOKEN
